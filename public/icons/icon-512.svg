<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d09"/>
      <stop offset="50%" stop-color="#2a160d"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea713c"/>
      <stop offset="100%" stop-color="#db5f29"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8edbec"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Filter for Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#db5f29" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#db5f29" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#db5f29" opacity="0.12"/>

  <!-- Central Sparkle / Prompt Symbol -->
  <g filter="url(#shadow)">
    <!-- Main 4-point Sparkle -->
    <path d="M256 96 C256 184 256 184 344 256 C256 328 256 328 256 416 C256 328 256 328 168 256 C256 184 256 184 256 96 Z" fill="url(#accentGrad)"/>
    
    <!-- Secondary Offset Cyan Sparkle -->
    <path d="M372 128 C372 158 372 158 402 182 C372 206 372 206 372 236 C372 206 372 206 342 182 C372 158 372 158 372 128 Z" fill="url(#cyanGlow)"/>

    <!-- Small Accent Sparkle -->
    <path d="M140 320 C140 340 140 340 160 356 C140 372 140 372 140 392 C140 372 140 372 120 356 C140 340 140 340 140 320 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Core Center Highlight -->
    <circle cx="256" cy="256" r="28" fill="#ffffff"/>
  </g>
</svg>
